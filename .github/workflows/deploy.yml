name: Deploy a Hostinger

# Compila la web en cada push a main y publica el contenido de dist/ en la rama "hostinger",
# que es la que Hostinger descarga en public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publicar dist en la rama hostinger
        working-directory: dist
        run: |
          git init -q -b hostinger
          git config user.name "Carlos Zeballos"
          git config user.email "199101880+carlos-zeballos@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger

      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs
